---
# PlatformIO / ESP-IDF workaround: force C mode for files inside PlatformIO
# projects. clangd's normal auto-detection misclassifies some ESP-IDF headers,
# so we override it here.
If: { PathMatch: .*(platformio|\.pio)/.* }
CompileFlags:
  Add: [-xc, -std=c11, -Wall, -Wextra]
---
# Default for everything else: just warning flags. Clangd will auto-detect
# C vs C++ from the file extension, and the compile DB will set the standard
# for project files.
If: { PathMatch: .* }
CompileFlags:
  Add: [-Wall, -Wextra]
